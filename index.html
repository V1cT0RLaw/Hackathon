<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — Attention Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__dot"></span>
        <h1 class="brand__title">Event Attention</h1>
      </div>
      <div class="topbar__meta">
        <label class="score-toggle">
          <input class="score-toggle__input" id="minorScoreToggle" type="checkbox" aria-label="Show minor scores" />
          <span class="score-toggle__switch" aria-hidden="true"></span>
          <span class="score-toggle__label">Show minor scores</span>
        </label>
        <span class="chip">Live</span>
        <span class="topbar__count" id="eventCount">0 events</span>
      </div>
    </div>
  </header>

  <section class="filterbar" aria-label="Filter events">
    <div class="filterbar__inner">
      <div class="filterbar__heading">
        <span class="filterbar__label">Filter events</span>
        <span class="filterbar__result" id="filterResult">Showing all events</span>
      </div>
      <div class="filterbar__controls">
        <label class="filter-control">
          <span class="filter-control__label">Test</span>
          <select class="filter-control__select" id="testFilter">
            <option value="">All tests</option>
            <option value="test_1">Test 1</option>
            <option value="test_2">Test 2</option>
          </select>
        </label>
        <label class="filter-control">
          <span class="filter-control__label">Theme</span>
          <select class="filter-control__select" id="themeFilter">
            <option value="">All themes</option>
          </select>
        </label>
        <label class="filter-control">
          <span class="filter-control__label">Region</span>
          <select class="filter-control__select" id="regionFilter">
            <option value="">All regions</option>
          </select>
        </label>
        <label class="filter-control">
          <span class="filter-control__label">Stakeholder</span>
          <select class="filter-control__select" id="stakeholderFilter">
            <option value="">All stakeholders</option>
          </select>
        </label>
        <button class="filter-reset" id="filterReset" type="button" disabled>Clear filters</button>
      </div>
    </div>
  </section>

  <main class="layout" id="layout">
    <!-- Priority column: top 3 big cards -->
    <section class="priority" aria-label="Priority events">
      <div class="section-head">
        <h2 class="section-head__title">Top Priority</h2>
        <p class="section-head__sub">Highest attention events, ranked</p>
      </div>
      <div class="priority__list" id="priorityList">
        <!-- big cards injected here -->
      </div>
    </section>

    <!-- Minor column: smaller cards -->
    <aside class="minor" aria-label="Other events">
      <div class="section-head">
        <h2 class="section-head__title">Other Events</h2>
        <p class="section-head__sub">Lower attention, name &amp; score only</p>
      </div>
      <div class="minor__list" id="minorList">
        <!-- small cards injected here -->
      </div>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="phase2-data.js"></script>
  <script src="historical-review.js"></script>
  <script src="preferences.js"></script>
  <script src="app.js"></script>
</body>
</html>
